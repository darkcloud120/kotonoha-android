plugins { id 'com.android.application' }
android {
    namespace 'tw.kotonoha.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.kotonoha.mobile'
        minSdk 28
        targetSdk 34
        versionCode 10
        versionName '1.0.0-rc1'
    }
    // Optional fixed signing key supplied only through the private build environment.
    if (System.getenv('KOTO_KEYSTORE')) {
        signingConfigs {
            debug {
                storeFile file(System.getenv('KOTO_KEYSTORE'))
                storePassword System.getenv('KOTO_STORE_PASSWORD')
                keyAlias 'kotonoha'
                keyPassword System.getenv('KOTO_STORE_PASSWORD')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
